name: Reusable npm publication

on:
  workflow_call:
    inputs:
      working-directory: {required: false, default: ., type: string}
      node-version: {required: false, default: '22', type: string}
      publish: {description: Publish from an explicitly dispatched protected release ref, required: false, default: false, type: boolean}

permissions:
  contents: read

jobs:
  verify:
    name: Pack and verify
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    defaults:
      run: {working-directory: "${{ inputs.working-directory }}"}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@concertable'
      - name: Install and test
        env: {NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          npm ci
          npm test
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packages"
      - name: Verify packed consumer install
        env: {NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes
          npm config set @concertable:registry https://npm.pkg.github.com
          npm install "$RUNNER_TEMP"/packages/*.tgz --ignore-scripts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: {name: npm-package, path: "${{ runner.temp }}/packages/*.tgz", if-no-files-found: error}

  publish:
    name: Attest and publish
    needs: verify
    if: ${{ inputs.publish && github.ref_protected && (github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: npm-package, path: "${{ runner.temp }}/packages"}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: "${{ inputs.node-version }}", registry-url: https://npm.pkg.github.com, scope: '@concertable'}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with: {subject-path: "${{ runner.temp }}/packages/*.tgz"}
      - name: Publish transferred package without lifecycle scripts
        env: {NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: npm publish "$RUNNER_TEMP"/packages/*.tgz --ignore-scripts --registry https://npm.pkg.github.com --provenance
