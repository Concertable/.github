name: Reusable NuGet publication

on:
  workflow_call:
    inputs:
      project: {description: Project or solution to pack, required: true, type: string}
      dotnet-version: {required: false, default: 10.0.x, type: string}
      configuration: {required: false, default: Release, type: string}
      publish: {description: Publish from an explicitly dispatched protected release ref, required: false, default: false, type: boolean}

permissions:
  contents: read

jobs:
  verify:
    name: Pack and verify
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    # See dotnet-ci.yml: a consumer's nuget.config reads its feed credential from this variable.
    env: {GITHUB_PACKAGES_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          source-url: https://nuget.pkg.github.com/Concertable/index.json
        env: {NUGET_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Pack
        env: {CONFIGURATION: "${{ inputs.configuration }}", PROJECT: "${{ inputs.project }}"}
        run: dotnet pack "$PROJECT" --configuration "$CONFIGURATION" --output "$RUNNER_TEMP/packages"
      - name: Require packages
        run: compgen -G "$RUNNER_TEMP/packages/*.nupkg" >/dev/null
      - name: Verify clean consumer
        env: {NUGET_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          python - "$RUNNER_TEMP/packages" "$RUNNER_TEMP/consumer/Consumer.csproj" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET, zipfile
          root = ET.Element('Project', {'Sdk': 'Microsoft.NET.Sdk'})
          props = ET.SubElement(root, 'PropertyGroup')
          ET.SubElement(props, 'TargetFramework').text = 'net10.0'
          items = ET.SubElement(root, 'ItemGroup')
          count = 0
          for path in sorted(pathlib.Path(sys.argv[1]).glob('*.nupkg')):
              if path.name.endswith('.symbols.nupkg'): continue
              with zipfile.ZipFile(path) as package:
                  nuspec = next(name for name in package.namelist() if name.endswith('.nuspec'))
                  metadata = ET.fromstring(package.read(nuspec)).find('{*}metadata')
                  ET.SubElement(items, 'PackageReference', {
                      'Include': metadata.findtext('{*}id'), 'Version': metadata.findtext('{*}version')})
                  count += 1
          if not count: raise SystemExit('No consumer packages found')
          ET.ElementTree(root).write(sys.argv[2], encoding='utf-8', xml_declaration=True)
          PY
          dotnet new nugetconfig --output "$RUNNER_TEMP/consumer" --force
          dotnet nuget add source "$RUNNER_TEMP/packages" --name candidate --configfile "$RUNNER_TEMP/consumer/nuget.config"
          dotnet nuget add source https://nuget.pkg.github.com/Concertable/index.json --name github --username Concertable --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text --configfile "$RUNNER_TEMP/consumer/nuget.config"
          # Packages restore OUTSIDE the project directory: a package that ships .cs files (Scriban
          # does) would otherwise be swept up by the SDK's **/*.cs glob and compiled alongside its
          # own assembly, failing the verify with CS0121 ambiguity that says nothing about the
          # package under test.
          dotnet restore "$RUNNER_TEMP/consumer/Consumer.csproj" --configfile "$RUNNER_TEMP/consumer/nuget.config" --packages "$RUNNER_TEMP/consumer-packages"
          dotnet build "$RUNNER_TEMP/consumer/Consumer.csproj" --configuration Release --no-restore
          rm -f "$RUNNER_TEMP/consumer/nuget.config"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: {name: nuget-packages, path: "${{ runner.temp }}/packages/*.nupkg", if-no-files-found: error}

  publish:
    name: Attest and publish
    needs: verify
    if: ${{ inputs.publish && github.ref_protected && (github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: nuget-packages, path: "${{ runner.temp }}/packages"}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with: {subject-path: "${{ runner.temp }}/packages/*.nupkg"}
      - name: Publish transferred packages
        env: {NUGET_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" --api-key "$NUGET_AUTH_TOKEN" --source https://nuget.pkg.github.com/Concertable/index.json --skip-duplicate
