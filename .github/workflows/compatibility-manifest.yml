name: Reusable compatibility manifest validation

on:
  workflow_call:
    inputs:
      manifest: {required: true, type: string}

permissions: {contents: read}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - name: Require immutable, qualified dependencies
        env: {MANIFEST: "${{ inputs.manifest }}"}
        run: |
          python - <<'PY'
          import json, os, re
          data = json.load(open(os.environ['MANIFEST'], encoding='utf-8'))
          assert data['schemaVersion'] == 1
          evidence = data['qualification']
          assert re.fullmatch(r'[0-9a-f]{40}', evidence['commit'])
          assert evidence['runUrl'].startswith('https://github.com/Concertable/')
          assert data['images'] and data['packages']
          image = r'ghcr\.io/concertable/[a-z0-9._/-]+:[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?@sha256:[0-9a-f]{64}'
          package = r'(?:nuget:[^@]+|npm:@[^/@]+/[^@]+)@[^@]+'
          assert all(re.fullmatch(image, item) for item in data['images'])
          assert all(re.fullmatch(package, item) for item in data['packages'])
          PY
