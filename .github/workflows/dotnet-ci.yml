name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      solution:
        description: Solution or project to build and test
        required: true
        type: string
      dotnet-version:
        required: false
        default: 10.0.x
        type: string
      configuration:
        required: false
        default: Release
        type: string
      working-directory:
        required: false
        default: .
        type: string
      run-tests:
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          source-url: https://nuget.pkg.github.com/Concertable/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore
        env:
          SOLUTION: ${{ inputs.solution }}
        run: dotnet restore "$SOLUTION"
      - name: Build
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          SOLUTION: ${{ inputs.solution }}
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore
      - name: Test
        if: ${{ inputs.run-tests }}
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          SOLUTION: ${{ inputs.solution }}
        run: dotnet test "$SOLUTION" --configuration "$CONFIGURATION" --no-build --no-restore
