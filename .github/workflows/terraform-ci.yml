name: Reusable Terraform CI

on:
  workflow_call:
    inputs:
      working-directory: {required: false, default: ., type: string}
      terraform-version: {required: false, default: 1.13.1, type: string}
      run-plan: {required: false, default: false, type: boolean}
      apply: {description: Apply the saved plan from a protected explicit dispatch, required: false, default: false, type: boolean}
    secrets:
      AZURE_CLIENT_ID: {required: false}
      AZURE_TENANT_ID: {required: false}
      AZURE_SUBSCRIPTION_ID: {required: false}

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: "${{ inputs.working-directory }}"}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: {terraform_version: "${{ inputs.terraform-version }}"}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Plan protected infrastructure change
    needs: validate
    if: ${{ inputs.run-plan && github.ref_protected && (github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {contents: read, id-token: write}
    defaults:
      run: {working-directory: "${{ inputs.working-directory }}"}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: {terraform_version: "${{ inputs.terraform-version }}"}
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: {name: terraform-plan, path: "${{ inputs.working-directory }}/tfplan", if-no-files-found: error}

  apply:
    name: Apply reviewed Terraform plan
    needs: plan
    if: ${{ inputs.apply && github.ref_protected && (github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {contents: read, id-token: write}
    defaults:
      run: {working-directory: "${{ inputs.working-directory }}"}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: {terraform_version: "${{ inputs.terraform-version }}"}
      - run: terraform init -input=false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: terraform-plan, path: "${{ inputs.working-directory }}"}
      - run: terraform apply -input=false tfplan
